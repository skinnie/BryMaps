name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 libglib2.0-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Smoke-test QML load (Linux, offscreen)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'brymaps')
          from PySide6.QtGui import QGuiApplication
          from PySide6.QtQml import QQmlApplicationEngine
          from PySide6.QtCore import QUrl
          import backend
          app = QGuiApplication(['brymaps'])
          app.setOrganizationName('BryMaps'); app.setApplicationName('BryMaps')
          e = QQmlApplicationEngine(); e.addImportPath('brymaps/qml')
          e.rootContext().setContextProperty('Backend', backend.Backend())
          e.load(QUrl.fromLocalFile('brymaps/qml/Main.qml'))
          assert e.rootObjects(), 'QML failed to load'
          print('QML OK')
          PY
      - name: Package
        run: pyinstaller --noconfirm --distpath dist --workpath build tools/brymaps.spec
      - uses: actions/upload-artifact@v4
        with:
          name: BryMaps-${{ runner.os }}
          path: dist/BryMaps
